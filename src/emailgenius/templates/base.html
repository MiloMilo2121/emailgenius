<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} | EmailGenius</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='app.css') }}">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/">EmailGenius</a>
      <nav class="topnav">
        <a href="/">Dashboard</a>
      </nav>
    </header>

    {% if ui.message %}
      <div class="notice notice-ok">{{ ui.message }}</div>
    {% endif %}
    {% if ui.error %}
      <div class="notice notice-error">{{ ui.error }}</div>
    {% endif %}

    <main class="layout">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ request.url_for('static', path='app.js') }}"></script>
</body>
</html>
