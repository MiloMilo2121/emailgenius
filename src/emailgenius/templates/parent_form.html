{% extends "base.html" %}

{% block content %}
  <section class="card form-card">
    <div class="section-head">
      <p class="eyebrow">Parent editor</p>
      <h1>{{ "Modifica parent" if parent else "Nuovo parent" }}</h1>
    </div>
    <form action="/parents" method="post" class="form-grid">
      <label>
        <span>Slug</span>
        <input name="slug" value="{{ parent.slug if parent else '' }}" placeholder="azienda-a">
      </label>
      <label>
        <span>Company name</span>
        <input name="company_name" value="{{ parent.company_name if parent else '' }}" required>
      </label>
      <label>
        <span>Tono</span>
        <input name="tone" value="{{ parent.tone if parent else '' }}" required>
      </label>
      <label>
        <span>CTA policy</span>
        <input name="cta_policy" value="{{ parent.cta_policy if parent else '' }}" required>
      </label>
      <label>
        <span>Sender name</span>
        <input name="sender_name" value="{{ parent.sender_name if parent else '' }}" required>
      </label>
      <label>
        <span>Sender company</span>
        <input name="sender_company" value="{{ parent.sender_company if parent else '' }}">
      </label>
      <label>
        <span>Telefono</span>
        <input name="sender_phone" value="{{ parent.sender_phone if parent else '' }}">
      </label>
      <label>
        <span>Booking URL</span>
        <input name="sender_booking_url" value="{{ parent.sender_booking_url if parent else '' }}">
      </label>
      <label class="full">
        <span>Offer catalog</span>
        <textarea name="offer_catalog" rows="3" required>{{ parent.offer_catalog | join('\n') if parent else '' }}</textarea>
      </label>
      <label class="full">
        <span>ICP</span>
        <textarea name="icp" rows="3" required>{{ parent.icp | join('\n') if parent else '' }}</textarea>
      </label>
      <label class="full">
        <span>Proof points</span>
        <textarea name="proof_points" rows="3">{{ parent.proof_points | join('\n') if parent else '' }}</textarea>
      </label>
      <label class="full">
        <span>Objections</span>
        <textarea name="objections" rows="3">{{ parent.objections | join('\n') if parent else '' }}</textarea>
      </label>
      <label class="full">
        <span>No-go claims</span>
        <textarea name="no_go_claims" rows="3">{{ parent.no_go_claims | join('\n') if parent else '' }}</textarea>
      </label>
      <label class="full">
        <span>Compliance notes</span>
        <textarea name="compliance_notes" rows="3">{{ parent.compliance_notes | join('\n') if parent else '' }}</textarea>
      </label>
      <label class="full">
        <span>Seed template</span>
        <textarea name="outreach_seed_template" rows="7">{{ parent.outreach_seed_template if parent else '' }}</textarea>
      </label>
      <label class="full">
        <span>Instantly intro</span>
        <textarea name="instantly_intro_template" rows="4">{{ parent.instantly_intro_template if parent else '' }}</textarea>
      </label>
      <label class="full">
        <span>Instantly CTA</span>
        <textarea name="instantly_cta_template" rows="4">{{ parent.instantly_cta_template if parent else '' }}</textarea>
      </label>
      <label class="checkbox">
        <input type="checkbox" name="set_active" value="1">
        <span>Imposta come parent attivo</span>
      </label>
      <button type="submit" class="button">Salva parent</button>
    </form>
  </section>
{% endblock %}
