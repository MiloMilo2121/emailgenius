services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: emailgenius-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-emailgenius}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-emailgenius}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - emailgenius_pg_data:/var/lib/postgresql/data

volumes:
  emailgenius_pg_data:
